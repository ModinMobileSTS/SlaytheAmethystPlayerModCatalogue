name: Generate mod catalogue

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan mods/*/*/metadata.json and generate indexes and README (no JAR execution)
        env:
          CATALOGUE_REPOSITORY: ${{ github.repository }}
        run: python scripts/catalogue.py --repository "$CATALOGUE_REPOSITORY"

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generate and commit indexes and README, retrying concurrent uploads
        env:
          CATALOGUE_REPOSITORY: ${{ github.repository }}
          CATALOGUE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "refs/heads/$CATALOGUE_BRANCH"
            git switch --detach FETCH_HEAD
            # The branch may have advanced since validation. Revalidate the latest tree.
            python -m unittest discover -s tests -v
            python scripts/catalogue.py --repository "$CATALOGUE_REPOSITORY" --ref "$CATALOGUE_BRANCH"
            git add --all -- index.json README.md
            git ls-files --cached --others --exclude-standard -z -- ':(top,glob)mods/*/index.json' |
              xargs -0 --no-run-if-empty git add --all --
            # Stage only deleted legacy root indexes; do not publish unrelated root JSON files.
            while IFS= read -r -d '' deleted; do
              git add -- "$deleted"
            done < <(git diff --name-only --diff-filter=D -z -- ':(top,glob)*.json')
            if git diff --cached --quiet; then
              echo 'Catalogue is already current.'
              exit 0
            fi
            git commit -m 'chores: regenerate mod catalogue'
            if git push origin "HEAD:refs/heads/$CATALOGUE_BRANCH"; then
              exit 0
            fi
            echo "Branch advanced or push rejected; retry $attempt/5."
          done
          echo 'Unable to publish catalogue after five attempts.' >&2
          exit 1
